# Cloud Build pipeline for the `skipper-studio` Cloud Run JOB (the studio CLI runner).
#
# build (packages/studio/Dockerfile, context = repo root) -> push to Artifact Registry
#   -> `gcloud run jobs deploy` (create-or-update the Job). Mirrors cloudbuild.yaml (the api
#   service pipeline); the only real differences are the Dockerfile, the image name, and
#   `run jobs deploy` instead of `run deploy`.
#
# Trigger: a 2nd Cloud Build trigger on the existing `skipper-gh` connection, path-filtered to
#   packages/studio/** (+ db/engine/shared/storage). See docs/specs/admin-ops-console-spec.md.
#
# ONE-TIME setup (NOT done here — see docs/guides/gcp-cloud-run-deploy.md):
#   - create the runtime SA `skipper-studio@$PROJECT_ID.iam.gserviceaccount.com`
#   - grant it secretmanager.secretAccessor on `dotenv-private-key-production`
#   - enable texttospeech.googleapis.com (TTS authorizes via the SA's ADC token — no IAM role,
#     no key file); GOOGLE_CLOUD_PROJECT + R2 vars come from the decrypted .env.production
#   - the Job is NOT public and NOT behind IAP (it's triggered by the admin-api / gcloud, not HTTP)

steps:
  # 1. Build the Job image.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'packages/studio/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/skipper-studio:latest', '.']

  # 2. Push to Artifact Registry — MUST precede the deploy (the deploy pulls this tag).
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/skipper-studio:latest']

  # 3. Create-or-update the Cloud Run Job (idempotent on every run).
  #    --max-retries=0: a half-run regen must never silently re-fire (it spends $ + writes prod).
  #    --task-timeout=21600 (6h): wall-clock cap. The real spend guard is the script's own
  #      --max-cost (aborts before any $ if the estimate exceeds the cap); this is just the
  #      runaway-wall-clock backstop. 3600 (1h) was too small once a FULL-REGION roam run
  #      (the whole TAHOE_RENO_BBOX — hundreds of clips narrated then synthesized at conc 6)
  #      became the worst case: it timed out at 1h and --max-retries=0 made that a hard fail.
  #      generate-narrations is idempotent (per-clip upsert; a re-run skips fresh clips), so a 6h
  #      one-shot covers a full region with headroom. Max allowed is 168h.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - skipper-studio
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/skipper-studio:latest
      - --region=${_REGION}
      - --service-account=skipper-studio@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=DOTENV_PRIVATE_KEY_PRODUCTION=dotenv-private-key-production:latest
      - --max-retries=0
      - --task-timeout=21600
      - --memory=2Gi
      - --cpu=1

substitutions:
  _REGION: us-east4
  _REPO: skipper

options:
  logging: CLOUD_LOGGING_ONLY
