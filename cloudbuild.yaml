# Cloud Build pipeline for the @skipper/api Cloud Run service.
#
# build (apps/api/Dockerfile, context = repo root, trimmed by .dockerignore)
#   -> push to Artifact Registry -> deploy to Cloud Run.
# ONE source of truth for BOTH manual runs (`gcloud builds submit --config
# cloudbuild.yaml`) and the GitHub push-to-main trigger (continuous deployment).
#
# Identity: the build runs as the project's Cloud Build service account (the Compute
# Engine default SA on new projects). Beyond build/push it needs roles/run.admin +
# roles/iam.serviceAccountUser to deploy. See docs/guides/gcp-cloud-run-deploy.md.
#
# Secrets: the image bakes the committed, dotenvx-ENCRYPTED .env.production; the
# runtime gets DOTENV_PRIVATE_KEY_PRODUCTION from Secret Manager (--set-secrets) to
# decrypt it at boot. Nothing secret enters GitHub or this file.
#
# Public access: --no-invoker-iam-check makes the service publicly invokable WITHOUT
# an allUsers IAM binding (which Domain Restricted Sharing blocks); the app's own
# Better Auth does the real authorization. Cloud Run injects PORT; the Dockerfile's
# `dotenvx run` has no --overload, so the injected PORT wins and Bun binds it.
#
# ⚠ SCALING IS A SPEND CONTROL HERE, NOT A CAPACITY ONE — see --max-instances below.
# apps/api/src/limits.ts owns every rider-facing cap, but its rate limiter is per-IP AND
# PER-INSTANCE (in-memory, no shared store), so the effective ceiling on anonymous
# model spend is `PLAN_RATE_HOUR x live instances`. That multiplier was Cloud Run's
# UNCHOSEN default of 100 until 2026-08-02 — nobody picked it, and at the default it put
# five figures of hourly Opus turns behind a single IP. It is now pinned, in two places
# that cover different holes:
#   1. SERVICE level (run.googleapis.com/maxScale) — the real ceiling, applied once by
#      hand and sticky across deploys:
#        gcloud run services update skipper-api --region us-east4 --max 3
#   2. REVISION level (--max-instances, below) — what THIS file can set. Deliberately
#      redundant: a revision-level cap does not compose under a traffic split (each
#      revision may run up to it), and a service-level cap set only in GCP is invisible
#      to anyone reading the repo, which is how the default went unnoticed. Each covers
#      the other.
# The VALUE is Google's own documented starting point for budget protection
# (docs.cloud.google.com/run/docs/configuring/max-instances). Raising it raises the
# anonymous spend ceiling proportionally — that is a founder call, not a capacity tweak.
#
# ⚠ MIN INSTANCES IS SET, AND IS DELIBERATELY *NOT* HERE. `--min 1` is applied at the SERVICE
# level out of band (2026-08-03), to hold one warm container: both Cloud Run AND Neon scale to
# zero and the two cold starts STACK, which at pre-launch traffic is the normal path rather than
# an edge case (measured 4.2s cold vs 0.2s warm). It is absent from this file on gcloud's own
# advice — `--min-instances` "is immutably set on each new Revision" while `--min` applies across
# revisions and "may be modified dynamically", so pinning it here would make every change to the
# warm count cost a deploy and would hold one warm instance PER revision mid-rollout. Max is the
# opposite case (its revision-level flag is a real second guard under a traffic split), which is
# why only max appears below. Do not "make them consistent" — the asymmetry is the point.
# Full rationale: docs/guides/gcp-cloud-run-deploy.md › Scaling.

steps:
  # 1. Build. Tag :latest — Cloud Run pins the image DIGEST per revision, so rollback
  #    is by revision (`gcloud run services update-traffic`), not by tag.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest', '.']

  # 2. Push to Artifact Registry — MUST precede deploy (the deploy pulls this tag).
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest']

  # 3. Deploy to Cloud Run (public + secret-mounted, idempotent on every run).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - skipper-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest
      - --region=${_REGION}
      - --no-invoker-iam-check
      # Revision-level half of the spend cap (the service-level ceiling is set out of
      # band — see the SCALING note in the header for why both exist).
      - --max-instances=3
      - --set-secrets=DOTENV_PRIVATE_KEY_PRODUCTION=dotenv-private-key-production:latest

substitutions:
  _REGION: us-east4
  _REPO: skipper

options:
  # Avoids the "build must specify a logs bucket" error new projects hit when no
  # default Cloud Build logging bucket / custom build SA is configured.
  logging: CLOUD_LOGGING_ONLY
