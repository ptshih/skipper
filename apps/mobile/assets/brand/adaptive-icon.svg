<?xml version="1.0" encoding="UTF-8"?>
<!-- Android adaptive-icon FOREGROUND: the badge scaled into the central safe zone (~68%),
     transparent. The paper background color is set in app.json (android.adaptiveIcon). The
     badge disc is circular, so any OS mask (circle/squircle) crops cleanly. 1024×1024. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <image x="162" y="162" width="700" height="700" xlink:href="badge-master.png"/>
</svg>
