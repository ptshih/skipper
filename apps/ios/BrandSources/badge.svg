<?xml version="1.0" encoding="UTF-8"?>
<!-- Skipper enamel travel badge (Trailhead 89). Self-contained circular badge, transparent
     outside the disc: pine disc + double cream keyline ring + a Tahoe mountain range + dotted
     tan atlas trail + the signature amber car token. Source of the app icon / splash / Android
     adaptive foreground. Colors are the theme palette hexes (src/theme/tokens.ts). 1024×1024. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <clipPath id="disc"><circle cx="512" cy="512" r="436"/></clipPath>

  <!-- pine enamel disc -->
  <circle cx="512" cy="512" r="436" fill="#1E5B40"/>

  <g clip-path="url(#disc)">
    <!-- distant mountain range (deeper pine) with cream snow caps -->
    <path d="M 76 556 L 250 372 L 330 452 L 452 300 L 560 446 L 664 360 L 792 500 L 948 556
             L 948 980 L 76 980 Z" fill="#15402F"/>
    <path d="M 452 300 L 416 346 L 452 360 L 488 346 Z" fill="#FBF3DD"/>
    <path d="M 664 360 L 638 394 L 664 404 L 690 394 Z" fill="#FBF3DD"/>
    <path d="M 250 372 L 224 406 L 250 416 L 276 406 Z" fill="#FBF3DD"/>
    <!-- dotted atlas trail (the road in the foreground) -->
    <path d="M 96 628 Q 336 580 512 600 T 928 576" fill="none" stroke="#CDB988"
      stroke-width="17" stroke-linecap="round" stroke-dasharray="1 32" opacity="0.95"/>
  </g>

  <!-- double cream keyline ring (the carved-sign edge), over the scene -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="#FFF8E6" stroke-width="26"/>
  <circle cx="512" cy="512" r="372" fill="none" stroke="#FBF3DD" stroke-width="7" opacity="0.5"/>

  <!-- the amber car token, riding the trail (DD7A33 body, inkBrown windows + wheels, amber hubs) -->
  <g>
    <circle cx="436" cy="596" r="46" fill="#2A2014"/>
    <circle cx="600" cy="596" r="46" fill="#2A2014"/>
    <circle cx="436" cy="596" r="17" fill="#DD7A33"/>
    <circle cx="600" cy="596" r="17" fill="#DD7A33"/>
    <path d="M 366 572
             C 366 554 375 545 392 543
             L 432 538 L 460 504
             C 469 490 483 483 502 483
             L 560 483
             C 581 483 596 492 606 511
             L 624 542 L 648 546
             C 665 549 674 559 674 574
             L 674 580
             C 674 591 666 598 655 598
             L 385 598
             C 375 598 366 589 366 579 Z" fill="#DD7A33"/>
    <path d="M 472 510 L 491 490 L 524 490 L 524 512 L 470 512 Z" fill="#2A2014"/>
    <path d="M 536 490 L 558 490 C 574 490 587 498 596 512 L 536 512 Z" fill="#2A2014"/>
  </g>
</svg>
