<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skipper Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700&family=Overpass+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before paint to avoid flash.
      (function () {
        var t = localStorage.getItem('sk_theme') || 'light'
        document.documentElement.setAttribute('data-theme', t)
        // Also keep the shadcn .dark class in sync for any legacy components.
        if (t === 'dark') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
