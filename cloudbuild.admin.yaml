# Cloud Build pipeline for the `skipper-admin` Cloud Run SERVICE (apps/admin: Hono + SPA, behind IAP).
#
# build (apps/admin/Dockerfile, multi-stage: client SPA + Hono server) -> push -> deploy. Mirrors
# cloudbuild.yaml; differences: the multi-stage Dockerfile, a --build-arg for the public Maps
# browser key, the image name, and NO --no-invoker-iam-check (IAP gates invocation, not allUsers).
#
# Trigger: a 3rd Cloud Build trigger on the existing `skipper-gh` connection, path-filtered to
#   apps/admin/** (+ db/shared/storage). Set the _VITE_MAPS_KEY substitution on the trigger
#   (a referrer-restricted browser key — public, not a secret).
#
# ONE-TIME setup (NOT here — see docs/specs/admin-ops-console-spec.md §7/§10):
#   - SA `skipper-admin@$PROJECT_ID...`: roles/run.developer on the `skipper-gen` job
#     (run.jobs.runWithOverrides + run.executions.get) + secretmanager.secretAccessor.
#   - ADMIN_EMAIL in .env.production (the single allowed IAP principal).
#   - Enable IAP on the service + grant the founder roles/iap.httpsResourceAccessor. UNDER DRS,
#     temporarily relax the policy to register the IAP service-agent run.invoker binding (§10).

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - apps/admin/Dockerfile
      - --build-arg
      - VITE_GOOGLE_MAPS_BROWSER_KEY=${_VITE_MAPS_KEY}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/admin:latest
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/admin:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - skipper-admin
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/admin:latest
      - --region=${_REGION}
      - --service-account=skipper-admin@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=DOTENV_PRIVATE_KEY_PRODUCTION=dotenv-private-key-production:latest

substitutions:
  _REGION: us-east4
  _REPO: skipper
  _VITE_MAPS_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
