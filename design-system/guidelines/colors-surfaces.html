<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: var(--space-xxl);
        background: var(--surface);
        font-family: var(--font-body);
      }
      .row {
        display: flex;
        gap: var(--space-lg);
      }
      .sw {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
      }
      .chip {
        height: 64px;
        border-radius: var(--radius-md);
        border: var(--border-thin) solid var(--rule);
      }
      .name {
        font-weight: 700;
        font-size: 13px;
        color: var(--ink);
      }
      code {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-dim);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw">
        <div class="chip" style="background: var(--surface)"></div>
        <span class="name">surface</span><code>#F2E7CC</code>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--surface-raised)"></div>
        <span class="name">surface-raised</span><code>#FBF3DD</code>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--surface-sunken)"></div>
        <span class="name">surface-sunken</span><code>#E7D9B5</code>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--keyline)"></div>
        <span class="name">keyline</span><code>#FFF8E6</code>
      </div>
    </div>
  </body>
</html>
