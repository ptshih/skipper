<!-- @dsCard group="Spacing" viewport="700x190" name="Borders & motion" subtitle="hair · thin · keyline (the carved double-rule); fast→stamp timing" -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: var(--space-xxl);
        background: var(--surface);
        font-family: var(--font-body);
        display: flex;
        gap: var(--space-xxxl);
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }
      .lab {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 12.5px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--ink-faint-role);
      }
      .rule-row {
        display: flex;
        align-items: center;
        gap: var(--space-md);
      }
      .rule-row span {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--ink-dim);
        width: 100px;
      }
      .ln {
        flex: 1;
        background: var(--ink);
      }
      .mo {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-dim);
        line-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="col" style="flex: 1">
      <span class="lab">Borders</span>
      <div class="rule-row"><span>hair · 0.5</span><div class="ln" style="height: 0.5px"></div></div>
      <div class="rule-row"><span>thin · 1</span><div class="ln" style="height: 1px"></div></div>
      <div class="rule-row"><span>keyline · 1.5</span><div class="ln" style="height: 1.5px"></div></div>
    </div>
    <div class="col">
      <span class="lab">Motion</span>
      <div class="mo">fast&nbsp;&nbsp;&nbsp;&nbsp;120ms</div>
      <div class="mo">base&nbsp;&nbsp;&nbsp;&nbsp;220ms</div>
      <div class="mo">slow&nbsp;&nbsp;&nbsp;&nbsp;420ms</div>
      <div class="mo">stamp&nbsp;&nbsp;&nbsp;520ms · the passport ink-press</div>
    </div>
  </body>
</html>
