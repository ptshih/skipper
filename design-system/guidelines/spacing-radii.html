<!-- @dsCard group="Spacing" viewport="700x200" name="Radii" subtitle="sm 8 · md 12 · lg 16 · xl 20 · pill — placards round at lg" -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: var(--space-xxl);
        background: var(--surface);
        font-family: var(--font-body);
        display: flex;
        gap: var(--space-xl);
        align-items: flex-end;
      }
      .sw {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-sm);
      }
      .box {
        width: 80px;
        height: 80px;
        background: var(--surface-raised);
        border: var(--border-keyline) solid var(--rule);
      }
      .name {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-dim);
      }
      .pill {
        width: 110px;
        height: 48px;
        border-radius: var(--radius-pill);
      }
    </style>
  </head>
  <body>
    <div class="sw"><div class="box" style="border-radius: var(--radius-sm)"></div><span class="name">sm · 8</span></div>
    <div class="sw"><div class="box" style="border-radius: var(--radius-md)"></div><span class="name">md · 12</span></div>
    <div class="sw"><div class="box" style="border-radius: var(--radius-lg)"></div><span class="name">lg · 16</span></div>
    <div class="sw"><div class="box" style="border-radius: var(--radius-xl)"></div><span class="name">xl · 20</span></div>
    <div class="sw"><div class="box pill"></div><span class="name">pill</span></div>
  </body>
</html>
