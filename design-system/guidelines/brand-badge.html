<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: var(--space-xxl);
        background: var(--surface);
        font-family: var(--font-body);
        display: flex;
        align-items: center;
        gap: var(--space-xxxl);
      }
      img {
        width: 160px;
        height: 160px;
        flex: none;
      }
      .wm {
        font-family: var(--font-display);
        font-size: 44px;
        letter-spacing: 1px;
        color: var(--ink);
        line-height: 1;
      }
      .tag {
        font-size: 14px;
        color: var(--ink-dim);
        margin-top: var(--space-md);
        max-width: 360px;
        line-height: 20px;
      }
      .kick {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 12.5px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--accent-warm);
        margin-bottom: var(--space-sm);
        display: block;
      }
    </style>
  </head>
  <body>
    <img src="../assets/badge-master.png" alt="Skipper enamel badge" />
    <div>
      <span class="kick">Now Departing</span>
      <div class="wm">SKIPPER</div>
      <p class="tag">A 1938 WPA national-park poster that learned to play audio — one corny guide, all the good stops.</p>
    </div>
  </body>
</html>
