<!-- @dsCard group="Type" viewport="700x250" name="Display — Alfa Slab One" subtitle="The WPA silkscreen headline. Large only — never below ~20pt." -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: var(--space-xxl);
        background: var(--surface);
        color: var(--ink);
      }
      .spec {
        display: flex;
        flex-direction: column;
        gap: var(--space-lg);
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: var(--space-lg);
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-dim);
        white-space: nowrap;
        width: 130px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="spec">
      <div class="row">
        <span class="meta">wordmark · 26</span>
        <span class="type-wordmark">SKIPPER</span>
      </div>
      <div class="row">
        <span class="meta">display · 30</span>
        <span class="type-display">Hop in. I'll do the talking.</span>
      </div>
      <div class="row">
        <span class="meta">placardTitle · 22</span>
        <span class="type-placardTitle">Emerald Bay Overlook</span>
      </div>
    </div>
  </body>
</html>
