<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing — 4-pt grid" subtitle="xs 4 · sm 8 · md 12 · lg 16 · xl 20 · xxl 24 · xxxl 32 · huge 48" -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: var(--space-xxl);
        background: var(--surface);
        font-family: var(--font-body);
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }
      .row {
        display: flex;
        align-items: center;
        gap: var(--space-md);
      }
      .name {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-dim);
        width: 110px;
        flex: none;
      }
      .bar {
        height: 16px;
        background: var(--pine);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="row"><span class="name">xs · 4</span><div class="bar" style="width: 4px"></div></div>
    <div class="row"><span class="name">sm · 8</span><div class="bar" style="width: 8px"></div></div>
    <div class="row"><span class="name">md · 12</span><div class="bar" style="width: 12px"></div></div>
    <div class="row"><span class="name">lg · 16 (gutter)</span><div class="bar" style="width: 16px"></div></div>
    <div class="row"><span class="name">xl · 20</span><div class="bar" style="width: 20px"></div></div>
    <div class="row"><span class="name">xxl · 24</span><div class="bar" style="width: 24px"></div></div>
    <div class="row"><span class="name">xxxl · 32</span><div class="bar" style="width: 32px"></div></div>
    <div class="row"><span class="name">huge · 48</span><div class="bar" style="width: 48px"></div></div>
  </body>
</html>
