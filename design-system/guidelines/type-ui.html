<!-- @dsCard group="Type" viewport="700x290" name="UI text — Bitter" subtitle="The screen-tuned slab serif: all titles, body, list names" -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        padding: var(--space-xxl);
        background: var(--surface);
        color: var(--ink);
      }
      .spec {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: var(--space-lg);
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-dim);
        white-space: nowrap;
        width: 150px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="spec">
      <div class="row">
        <span class="meta">titleXL · 700 · 24</span>
        <span class="type-titleXL">Sources & Licenses</span>
      </div>
      <div class="row">
        <span class="meta">title · 700 · 20</span>
        <span class="type-title">The North Shore Drive</span>
      </div>
      <div class="row">
        <span class="meta">heading · 700 · 17</span>
        <span class="type-heading">Start the drive</span>
      </div>
      <div class="row">
        <span class="meta">body · 400 · 16</span>
        <span class="type-body">The skipper talks as you reach each stop on the real roads.</span>
      </div>
      <div class="row">
        <span class="meta">bodyStrong · 600 · 16</span>
        <span class="type-bodyStrong">Emerald Bay Overlook</span>
      </div>
    </div>
  </body>
</html>
